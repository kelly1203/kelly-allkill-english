<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>켈리's 운동기록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0C0C;--s1:#171717;--s2:#202020;--s3:#2B2B2B;--bd:#303030;--acc:#C6FF47;--blu:#6BAFFF;--amb:#FFB347;--tx:#F0F0F0;--mu:#666;--mu2:#444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',sans-serif;font-size:14px;min-height:100vh;padding-bottom:76px;overscroll-behavior:none}
input{-webkit-appearance:none;appearance:none}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
button{font-family:'Noto Sans KR',sans-serif}

.hd{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.hd-logo{font-size:15px;font-weight:700;letter-spacing:-.03em}
.hd-logo em{color:var(--acc);font-style:normal}
.hd-km{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--bd);border-radius:99px;padding:6px 14px}
.hd-km input{width:38px;background:none;border:none;color:var(--acc);font-family:'Space Mono',monospace;font-weight:700;font-size:14px;text-align:right;outline:none}
.hd-km-lbl{font-size:11px;color:var(--mu)}

.bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--s1);border-top:1px solid var(--bd);display:flex}
.nb{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mu);background:none;border:none;cursor:pointer;transition:color .15s}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--acc)}

.view{display:none}.view.on{display:block}

.dtabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex:none;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:500;border:1px solid var(--bd);background:var(--s2);color:var(--mu);cursor:pointer;transition:all .15s;white-space:nowrap}
.dtab.run.on{background:var(--acc);color:#000;border-color:var(--acc)}
.dtab.str.on{background:var(--blu);color:#000;border-color:var(--blu)}

.dhd{padding:4px 16px 12px;display:flex;align-items:flex-start;justify-content:space-between}
.dhd-title{font-size:20px;font-weight:700;letter-spacing:-.04em;line-height:1.25}
.dhd-sub{font-size:13px;font-weight:400;color:var(--mu);margin-top:2px}
.badge{font-size:10px;font-weight:700;padding:4px 11px;border-radius:99px;letter-spacing:.05em;margin-top:4px}
.badge-run{background:rgba(198,255,71,.1);color:var(--acc)}
.badge-str{background:rgba(107,175,255,.1);color:var(--blu)}

.datebar{display:flex;align-items:center;justify-content:space-between;margin:0 12px 4px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.datebar-left{display:flex;align-items:center;gap:8px}
.datebar-icon{width:16px;height:16px;stroke:var(--acc);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.datebar-txt{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--tx);letter-spacing:.02em}
.datebar-label{font-size:10px;color:var(--mu)}
.date-edit{background:none;border:none;color:var(--acc);font-size:11px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px;background:var(--s3)}
input[type=date].hidden-date{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

.slabel{font-size:10px;font-weight:700;color:var(--mu2);letter-spacing:.1em;padding:14px 16px 6px;text-transform:uppercase}

/* EXERCISE CARD */
.ec{margin:0 12px 6px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:13px 14px;transition:border-color .2s}
.ec.done{border-color:rgba(198,255,71,.25)}
.ec-top{display:flex;align-items:flex-start;gap:10px}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bd);background:var(--s3);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;margin-top:1px}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk svg{width:12px;height:12px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .1s}
.chk.on svg{opacity:1}
.ec-info{flex:1;min-width:0}
.ec-name{font-size:13px;font-weight:500;line-height:1.4;transition:color .15s}
.done .ec-name{text-decoration:line-through;color:var(--mu)}
.ec-target{font-family:'Space Mono',monospace;font-size:10px;color:var(--mu2);margin-top:2px}
.wrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--s3)}
.winput{display:flex;align-items:center;gap:4px;background:var(--s3);border-radius:10px;padding:6px 11px}
.winput input{width:56px;background:none;border:none;color:var(--acc);font-family:'Space Mono',monospace;font-size:17px;font-weight:700;text-align:center;outline:none}
.wunit{font-size:11px;color:var(--mu)}
.wlabel{font-size:11px;color:var(--mu);margin-left:auto}

/* TIP TOGGLE */
.tip-btn{display:flex;align-items:center;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--s3);background:none;border-left:none;border-right:none;border-bottom:none;color:var(--amb);font-size:11px;font-weight:500;cursor:pointer;padding-left:0;width:100%;text-align:left;letter-spacing:.02em}
.tip-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;flex:none}
.tip-btn.open svg{transform:rotate(90deg)}
.tip-body{display:none;margin-top:10px;background:var(--s3);border-radius:12px;padding:12px 14px}
.tip-body.show{display:block}
.tip-item{font-size:12px;color:#C8B88A;line-height:1.9;display:flex;gap:7px}
.tip-item::before{content:'·';color:var(--amb);flex:none;font-size:14px}
.tip-warn{font-size:11px;color:#FF9E6B;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,158,107,.2);display:flex;gap:6px;line-height:1.7}
.tip-warn::before{content:'⚠';flex:none}

/* RUN CARD */
.rcard{margin:0 12px 12px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:16px}
.rtip{font-size:12px;color:var(--mu);margin-bottom:12px;line-height:1.6}
.rinputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rbox{background:var(--s3);border-radius:12px;padding:12px}
.rbox-lbl{font-size:9px;font-weight:700;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.rbox input{width:100%;background:none;border:none;color:var(--tx);font-family:'Space Mono',monospace;font-size:28px;font-weight:700;outline:none;line-height:1}
.rbox-unit{font-size:11px;color:var(--mu);margin-top:4px}
.pace-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0 12px;border-bottom:1px solid var(--s3)}
.pace-lbl{font-size:12px;color:var(--mu)}
.pace-val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--acc)}
.rdone-btn{width:100%;margin-top:12px;padding:12px;border-radius:12px;font-size:14px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.rdone-btn.idle{background:var(--acc);color:#000}
.rdone-btn.done{background:var(--s3);color:var(--mu);border:1px solid var(--bd)}

.savebar{padding:12px 16px}
.savebtn{width:100%;padding:15px;border-radius:16px;background:var(--acc);color:#000;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:opacity .15s;letter-spacing:-.01em}
.savebtn:active{opacity:.8}

/* HISTORY */
.sec{padding:12px 16px}
.sec-title{font-size:15px;font-weight:700;margin-bottom:12px}
.hempty{text-align:center;color:var(--mu);padding:4rem 1rem;font-size:13px;line-height:1.7}
.hcard{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:8px}
.hcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hcard-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--mu)}
.hdelbtn{background:none;border:none;color:var(--mu2);font-size:12px;cursor:pointer;padding:2px 6px}
.hcard-title{font-size:14px;font-weight:700;margin-bottom:4px}
.hcard-stat{font-size:11px;color:var(--mu);margin-bottom:10px}
.hexlist{font-size:12px;line-height:2}
.hexrow{display:flex;align-items:baseline;gap:6px}
.hdot{color:var(--acc);font-size:9px}
.hname{color:var(--tx);flex:1}
.hkg{color:var(--acc);font-family:'Space Mono',monospace;font-size:12px}

/* EXPORT */
.expbox{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.expbox-lbl{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.exptext{font-family:'Space Mono',monospace;font-size:11px;color:var(--mu);white-space:pre-wrap;line-height:1.8;max-height:320px;overflow-y:auto}
.copybtn{width:100%;padding:15px;border-radius:16px;background:var(--blu);color:#000;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:opacity .15s;margin-bottom:10px}
.copybtn:active{opacity:.8}
.exphint{font-size:12px;color:var(--mu);text-align:center;line-height:1.8}

.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;padding:10px 22px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-logo">켈리's <em>운동기록</em></div>
  <div class="hd-km">
    <input type="number" id="km-input" placeholder="0" min="0" max="999" step="0.1" oninput="saveKm()">
    <span class="hd-km-lbl">/ 100 km</span>
  </div>
</div>

<div class="view on" id="v-today">
  <div class="dtabs" id="dtabs"></div>
  <div class="datebar">
    <div class="datebar-left">
      <svg class="datebar-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <div>
        <div class="datebar-txt" id="date-display">—</div>
        <div class="datebar-label">기록 날짜</div>
      </div>
    </div>
    <button class="date-edit" onclick="document.getElementById("date-picker").showPicker?document.getElementById("date-picker").showPicker():document.getElementById("date-picker").click()">날짜 변경</button>
    <input type="date" id="date-picker" class="hidden-date" onchange="onDateChange()">
  </div>
  <div id="day-content"></div>
  <div class="savebar"><button class="savebtn" onclick="saveWorkout()" id="savebtn-label">저장하기</button></div>
</div>

<div class="view" id="v-history">
  <div class="sec"><div class="sec-title">운동 기록</div><div id="hlist"></div></div>
</div>

<div class="view" id="v-export">
  <div class="sec">
    <div class="sec-title">Claude에게 분석 요청</div>
    <div class="expbox"><div class="expbox-lbl">데이터 미리보기</div><div class="exptext" id="exptext">기록을 저장하면 여기에 나타나요.</div></div>
    <button class="copybtn" onclick="doCopy()">클립보드에 복사</button>
    <div class="exphint">복사 후 Claude 채팅창에 붙여넣고<br>"이 운동 기록 분석해줘"라고 보내세요</div>
  </div>
</div>

<div class="bnav">
  <button class="nb on" id="nb-today" onclick="goView('today')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>오늘
  </button>
  <button class="nb" id="nb-history" onclick="goView('history')">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>기록
  </button>
  <button class="nb" id="nb-export" onclick="goView('export')">
    <svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>분석
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const DLABEL = ['월','화','수','목','금','토','일'];
const DTYPE  = ['run','str','run','str','run','str','run'];
const DTITLE = ['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
const DSUB   = ['러닝','상체 + 어깨','회복 러닝','하체 메인','회복 러닝','전신 + 힙','러닝 또는 휴식'];

// tips: { points: [...], warn: '...' }
const TIPS = {
  't_w1':{p:['경사 없이 빠른 걷기 4~5km/h 또는 사이클 가볍게','땀이 살짝 날 정도면 충분','이걸 건너뛰면 무릎·허리에 바로 부하가 가요'],w:'워밍업 없이 바로 무거운 무게는 부상 위험!'},
  't_a1':{p:['밴드를 양손으로 잡고 가슴 앞에서 시작','양팔을 옆으로 최대한 벌려 뒤로 당기기','등 중앙에서 날개뼈를 모으는 느낌','천천히 되돌아오기']},
  't_a2':{p:['벽에 등을 대고 양팔을 머리 위로 들기','팔꿈치와 손목을 벽에 붙인 채 천천히 내리기','손이 벽에서 떨어지면 안 됨 — 어깨가 굽어있을수록 힘들어요','통증 없는 범위에서 조금씩 넓혀가기'],w:'어깨에 통증이 오면 즉시 멈추기'},
  't_a3':{p:['밴드 한쪽을 고정하고 팔꿈치를 옆구리에 딱 붙이기','팔꿈치 90도 각도 유지한 채 팔을 바깥으로만 회전','어깨가 올라가지 않게 — 팔꿈치는 절대 안 움직임','좌우 각각 실시']},
  't_m1':{p:['손 너비는 어깨보다 살짝 넓게 바를 잡기','가슴 위쪽(쇄골 아래)까지 당겨 내리기','등을 살짝 젖히고 가슴을 바에 가져간다는 느낌','내릴 때 천천히 버티며'],w:'목 뒤로 당기는 건 경추에 부담, 가슴 앞으로'},
  't_m2':{p:['등을 곧게, 발을 바닥에 고정','명치를 앞으로 내민다는 느낌으로 당기기','팔꿈치가 옆으로 벌어지지 않게 — 몸통 옆으로','내릴 때 팔이 완전히 펴지도록 늘리기']},
  't_m3':{p:['팔꿈치를 귀 옆으로 올린 채 당기기 (페이스풀)','손이 아니라 팔꿈치로 당기는 느낌','뒷어깨와 등 위쪽에 자극이 와야 정상','무게보다 자극 느끼는 것이 우선'],w:'굽은 어깨 교정의 핵심 운동, 절대 빠뜨리지 말기'},
  't_m4':{p:['팔꿈치를 살짝 구부리고 양옆으로 들어올리기','어깨 높이까지만 — 그 이상은 승모근만 써요','새끼손가락이 엄지보다 살짝 높게 (물 따르듯)','천천히 내리며 버티기'],w:'무게 욕심 내면 몸을 흔들게 됨 — 가볍게 정확하게'},
  't_m5':{p:['덤벨을 귀 옆(어깨 위)에서 시작','코어 잡고 허리를 과도하게 젖히지 않기','올릴 때 팔꿈치가 완전히 펴지기 직전 멈추기'],w:'켈리님 루틴 메모: 무겁게 욕심내지 않기 — 등으로 대신하게 됨'},
  't_m6':{p:['가슴을 쭉 펴고 날개뼈를 모은 상태로 시작','내릴 때 팔꿈치가 45도 방향으로 — 너무 벌리면 어깨 부담','가슴 아래쪽에 바/덤벨이 오도록','천천히 내리고 가슴이 스트레칭 느낄 때 올리기'],w:'가슴 운동 너무 많이 하면 굽은 어깨가 심해짐 — 세트 수 조절'},
  't_m7':{p:['케이블/밴드를 위에서 아래로 당기기','팔꿈치는 옆구리에 고정 — 흔들리면 안 됨','팔이 완전히 펴지는 지점까지','천천히 올리며 삼두를 늘리기']},
  't_m8':{p:['팔꿈치를 옆구리에 붙이고 시작','손목이 꺾이지 않게 일자 유지','다 올라갔을 때 알통 1초 조이기','내릴 때 천천히 버티며']},
  't_c1':{p:['손목 아래 어깨, 코어를 단단하게 조이기','엉덩이가 올라가거나 처지지 않게 — 일직선','호흡을 참지 말고 계속 내쉬기','30초가 힘들면 20초부터 시작'],w:'허리가 아프면 무릎 플랭크로 대체 가능'},
  't_c2':{p:['바닥에 누워 팔과 다리를 90도로 들기','반대편 팔+다리를 동시에 뻗어 내리기','허리가 바닥에서 떨어지지 않는 게 핵심','천천히 뻗고 돌아오기']},
  'th_w1':{p:['경사 없이 빠른 걷기 또는 사이클 가볍게','하체 운동 전 관절 충분히 풀기','7~10분 — 땀이 살짝 나면 OK'],w:'하체 날은 워밍업이 더 중요해요, 무릎·고관절 보호'},
  'th_a1':{p:['양발 어깨 너비로 서서 손은 허리에 올리기','골반만 크게 원을 그리듯 돌리기 — 훌라후프 상상','상체·무릎은 완전 고정, 골반만 움직이기','시계 방향 10회 → 반시계 방향 10회'],w:'원이 작으면 효과 없어요 — 크게 크게!'},

let curDay = 0;
let openTips = new Set();

let recordDate = '';  // YYYY-MM-DD

function toKoreanDateStr(ymd) {
  // ymd = '2026-05-07'
  const [y,m,d] = ymd.split('-');
  const days = ['일','월','화','수','목','금','토'];
  const dow = days[new Date(+y, +m-1, +d).getDay()];
  return y + '년 ' + m + '월 ' + d + '일 ' + dow + '요일';
}

function todayYMD() {
  const n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}

function setDate(ymd) {
  recordDate = ymd;
  document.getElementById('date-picker').value = ymd;
  document.getElementById('date-display').textContent = toKoreanDateStr(ymd);
  const isToday = ymd === todayYMD();
  const btn = document.getElementById('savebtn-label');
  if(btn) btn.textContent = isToday ? '오늘 운동 저장하기' : ymd.replace(/-/g,'.') + ' 운동 저장하기';
}

function onDateChange() {
  const v = document.getElementById('date-picker').value;
  if(v) setDate(v);
}

function init(){
  const m=[6,0,1,2,3,4,5];
  curDay=m[new Date().getDay()];
  setDate(todayYMD());
  buildTabs(); renderDay(curDay); loadKm();
}

function buildTabs(){
  document.getElementById('dtabs').innerHTML=DLABEL.map((d,i)=>
    `<button class="dtab ${DTYPE[i]}${i===curDay?' on':''}" onclick="selDay(${i})">${d}</button>`
  ).join('');
}

function selDay(i){curDay=i;buildTabs();renderDay(i);}

function getDraft(i){return JSON.parse(localStorage.getItem('dr_'+i)||'{}')}
function setDraft(i,k,v){const d=getDraft(i);d[k]=v;localStorage.setItem('dr_'+i,JSON.stringify(d))}

function renderDay(idx){
  const day=W[idx],dr=getDraft(idx),isRun=day.type==='run';
  let h=`<div class="dhd"><div><div class="dhd-title">${DTITLE[idx]}<div class="dhd-sub">${DSUB[idx]}</div></div></div><div class="badge ${isRun?'badge-run':'badge-str'}">${isRun?'러닝':'근력'}</div></div>`;

  day.s.forEach(sec=>{
    if(sec.n) h+=`<div class="slabel">${sec.n}</div>`;
    sec.items.forEach(item=>{
      if(item.isRun){
        const km=dr[item.id+'_km']||'',mn=dr[item.id+'_min']||'',dn=dr[item.id+'_done']||false;
        h+=`<div class="rcard">
          <div class="rtip">${item.tip}</div>
          <div class="rinputs">
            <div class="rbox"><div class="rbox-lbl">거리</div>
              <input type="number" step="0.1" min="0" placeholder="0.0" value="${km}" id="km_${item.id}" oninput="setDraft(${idx},'${item.id}_km',this.value);upPace('${item.id}')">
              <div class="rbox-unit">km</div></div>
            <div class="rbox"><div class="rbox-lbl">시간</div>
              <input type="number" step="1" min="0" placeholder="0" value="${mn}" id="mn_${item.id}" oninput="setDraft(${idx},'${item.id}_min',this.value);upPace('${item.id}')">
              <div class="rbox-unit">분</div></div>
          </div>
          <div class="pace-row"><span class="pace-lbl">평균 페이스</span><span class="pace-val" id="pc_${item.id}">${paceStr(km,mn)}</span></div>
          <button class="rdone-btn ${dn?'done':'idle'}" id="rb_${item.id}" onclick="togRun(${idx},'${item.id}')">${dn?'완료 ✓':'완료 표시'}</button>
        </div>`;
      } else {
        const dn=dr[item.id+'_done']||false,kg=dr[item.id+'_kg']||'';
        const tip=TIPS[item.id];
        h+=`<div class="ec${dn?' done':''}${item.nw?' nw':''}" id="ec_${item.id}">
          <div class="ec-top">
            <div class="chk${dn?' on':''}" onclick="togEx(${idx},'${item.id}')">
              <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
            </div>
            <div class="ec-info">
              <div class="ec-name">${item.name}</div>
              ${item.t?`<div class="ec-target">${item.t}</div>`:''}
            </div>
          </div>
          ${!item.nw?`<div class="wrow">
            <div class="winput">
              <input type="number" step="0.5" min="0" placeholder="—" value="${kg}" id="kg_${item.id}" oninput="setDraft(${idx},'${item.id}_kg',this.value)">
            </div>
            <span class="wunit">kg</span>
            <span class="wlabel">사용 무게</span>
          </div>`:''}
          ${tip?`<button class="tip-btn${openTips.has(item.id)?' open':''}" id="tbtn_${item.id}" onclick="togTip('${item.id}')">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            폼 & 주의사항
          </button>
          <div class="tip-body${openTips.has(item.id)?' show':''}" id="tbody_${item.id}">
            ${tip.p.map(p=>`<div class="tip-item">${p}</div>`).join('')}
            ${tip.w?`<div class="tip-warn">${tip.w}</div>`:''}
          </div>`:''}
        </div>`;
      }
    });
  });

  document.getElementById('day-content').innerHTML=h;
}

function togTip(id){
  if(openTips.has(id)) openTips.delete(id); else openTips.add(id);
  const open=openTips.has(id);
  const btn=document.getElementById('tbtn_'+id);
  const body=document.getElementById('tbody_'+id);
  if(btn) btn.classList.toggle('open',open);
  if(body) body.classList.toggle('show',open);
}

function paceStr(km,mn){
  if(!km||!mn||+km<=0||+mn<=0) return '——';
  const p=+mn/+km,m=Math.floor(p),s=Math.round((p-m)*60);
  return `${m}'${String(s).padStart(2,'0')}" / km`;
}
function upPace(id){
  const km=document.getElementById('km_'+id)?.value||'',mn=document.getElementById('mn_'+id)?.value||'';
  const el=document.getElementById('pc_'+id);
  if(el) el.textContent=paceStr(km,mn);
}

function togEx(idx,id){
  const dr=getDraft(idx);dr[id+'_done']=!dr[id+'_done'];
  localStorage.setItem('dr_'+idx,JSON.stringify(dr));renderDay(idx);
}
function togRun(idx,id){
  const dr=getDraft(idx);dr[id+'_done']=!dr[id+'_done'];
  localStorage.setItem('dr_'+idx,JSON.stringify(dr));renderDay(idx);
}

function saveWorkout(){
  const idx=curDay,day=W[idx],dr=getDraft(idx);
  const [yr,mo,dy] = recordDate.split('-');
  const ds = yr + '. ' + mo + '. ' + dy + '.';
  const now=new Date(recordDate);
  const log={date:ds,ymd:recordDate,ts:now.getTime(),dayIdx:idx,dayTitle:DTITLE[idx],daySub:DSUB[idx],type:DTYPE[idx],exs:[]};
  day.s.forEach(sec=>sec.items.forEach(item=>{
    if(item.isRun){
      log.exs.push({name:item.name,km:dr[item.id+'_km']||null,min:dr[item.id+'_min']||null,done:dr[item.id+'_done']||false,isRun:true});
    } else {
      const e={name:item.name,target:item.t||null,done:dr[item.id+'_done']||false};
      if(!item.nw) e.kg=dr[item.id+'_kg']||null;
      log.exs.push(e);
    }
  }));
  const logs=JSON.parse(localStorage.getItem('wlogs')||'[]');
  logs.unshift(log);
  localStorage.setItem('wlogs',JSON.stringify(logs)); // 무제한 저장
  toast('저장 완료!');
  if(document.getElementById('v-history').classList.contains('on')) renderHistory();
  if(document.getElementById('v-export').classList.contains('on')) renderExport();
}

function renderHistory(){
  const logs=JSON.parse(localStorage.getItem('wlogs')||'[]');
  const el=document.getElementById('hlist');
  if(!logs.length){el.innerHTML='<div class="hempty">아직 저장된 기록이 없어요.<br>운동 후 저장 버튼을 눌러보세요!</div>';return;}
  el.innerHTML=logs.map((log,i)=>{
    const done=log.exs.filter(e=>e.done).length;
    const total=log.exs.filter(e=>!e.name.includes('스트레칭')).length;
    const rows=log.exs.filter(e=>e.done&&(e.kg||e.km)).map(e=>{
      if(e.isRun) return `<div class="hexrow"><span class="hdot">◆</span><span class="hname">${e.name}</span><span class="hkg">${e.km?e.km+'km':''}${e.min?' '+e.min+'분':''}</span></div>`;
      return `<div class="hexrow"><span class="hdot">◆</span><span class="hname">${e.name}</span>${e.kg?`<span class="hkg">${e.kg}kg</span>`:''}</div>`;
    }).join('');
    return `<div class="hcard">
      <div class="hcard-top"><span class="hcard-date">${log.date}</span><button class="hdelbtn" onclick="delLog(${i})">삭제</button></div>
      <div class="hcard-title">${log.dayTitle} · ${log.daySub}</div>
      <div class="hcard-stat">완료 ${done} / ${total}개</div>
      <div class="hexlist">${rows||'<span style="color:var(--mu2);font-size:11px">무게 기록 없음</span>'}</div>
    </div>`;
  }).join('');
}

function delLog(i){
  const logs=JSON.parse(localStorage.getItem('wlogs')||'[]');
  logs.splice(i,1);
  localStorage.setItem('wlogs',JSON.stringify(logs));
  renderHistory();renderExport();toast('삭제되었어요');
}

function renderExport(){
  const logs=JSON.parse(localStorage.getItem('wlogs')||'[]');
  const km=document.getElementById('km-input')?.value||'0';
  const month=new Date().toLocaleDateString('ko',{year:'numeric',month:'long'});
  if(!logs.length){document.getElementById('exptext').textContent='기록을 저장하면 여기에 나타나요.';return;}
  let t=`[켈리's 운동기록 — Claude 분석용]\n이 기록을 분석해줘. 무게 증가 트렌드, 개선점, 다음 목표를 알려줘.\n\n${month} 누적 러닝: ${km}km / 목표 100km\n\n`;
  logs.forEach(log=>{
    const ds=log.ymd?log.ymd.replace(/-/g,'.'):log.date;
    t+=`◆ ${ds}  ${log.dayTitle} (${log.daySub})\n`;
    log.exs.forEach(e=>{
      if(!e.done) return;
      if(e.isRun){
        t+=`  ✓ ${e.name}`;
        if(e.km) t+=` — ${e.km}km`;
        if(e.min) t+=` ${e.min}분`;
        if(e.km&&e.min){const p=+e.min/+e.km,m=Math.floor(p),s=Math.round((p-m)*60);t+=` (페이스 ${m}'${String(s).padStart(2,'0')}")`;}
        t+='\n';
      } else {
        t+=`  ✓ ${e.name}`;
        if(e.target) t+=` [${e.target}]`;
        if(e.kg) t+=` → ${e.kg}kg`;
        t+='\n';
      }
    });
    t+='\n';
  });
  document.getElementById('exptext').textContent=t;
}

function doCopy(){
  const txt=document.getElementById('exptext').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('복사 완료!'));
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('복사 완료!');}
}

function goView(v){
  ['today','history','export'].forEach(x=>{
    document.getElementById('v-'+x).classList.toggle('on',x===v);
    document.getElementById('nb-'+x).classList.toggle('on',x===v);
  });
  if(v==='history') renderHistory();
  if(v==='export') renderExport();
}

function saveKm(){
  const v=document.getElementById('km-input').value;
  localStorage.setItem('km_'+new Date().toISOString().slice(0,7),v);
  if(document.getElementById('v-export').classList.contains('on')) renderExport();
}
function loadKm(){
  const v=localStorage.getItem('km_'+new Date().toISOString().slice(0,7));
  if(v) document.getElementById('km-input').value=v;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2000);
}

init();
</script>
</body>
</html>
